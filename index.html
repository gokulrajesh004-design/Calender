<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartQ 2027, Themed Monthly Experience</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#333333; --ink-2:#6b6b6b; --ink-3:#9a9a9a; --line:#e8e6e1; --paper:#ffffff; --wash:#faf9f6;
    --l1:#FCC529; --l1-t:#FCF6E6; --l1-d:#8a6d12;
    --l2:#ED6940; --l2-t:#F8EBE6; --l2-d:#b5431f;
    --l3:#3F99A8; --l3-t:#E5F2F0; --l3-d:#2a6f7a;
    --l4:#155493; --l4-t:#E2E7EE; --l4-d:#155493;
    --l5:#98543B; --l5-t:#F4EAE5; --l5-d:#7a3f2a;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{font-family:'Poppins',system-ui,sans-serif;color:var(--ink);background:var(--paper);overflow:hidden;}
  button{font-family:inherit;color:inherit;}
  :focus-visible{outline:2px solid var(--l4);outline-offset:2px;}

  .view{position:absolute;inset:0;overflow-y:auto;transition:opacity .35s ease,transform .35s ease;}
  #view-calendar{opacity:1;transform:none;}
  #view-detail{opacity:0;pointer-events:none;transform:translateX(32px);}
  body.detail-open #view-calendar{opacity:0;pointer-events:none;transform:translateX(-32px);}
  body.detail-open #view-detail{opacity:1;pointer-events:all;transform:none;}

  /* HEADER */
  .masthead{display:grid;grid-template-columns:auto 1fr auto;align-items:stretch;border-bottom:1px solid var(--line);}
  .year{background:var(--l1);padding:28px 36px 22px 44px;display:flex;align-items:flex-end;}
  .year span{font-size:104px;font-weight:800;line-height:.82;letter-spacing:-5px;color:#1e1e1e;}
  .title-block{padding:30px 40px 26px;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;}
  .title-block h1{font-size:34px;font-weight:600;line-height:1.1;letter-spacing:-.5px;}
  .title-block p{font-size:13px;color:var(--ink-2);max-width:520px;line-height:1.6;}
  .brand{padding:30px 44px 26px 0;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;gap:4px;text-align:right;}
  .brand strong{font-size:18px;font-weight:700;}
  .brand small{font-size:11px;color:var(--ink-3);}

  /* LEGEND / FILTER */
  .toolbar{display:flex;align-items:center;gap:10px;padding:16px 44px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .toolbar .hint{font-size:11.5px;color:var(--ink-3);margin-right:6px;}
  .chip{display:flex;align-items:center;gap:8px;padding:7px 14px 7px 10px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:12px;font-weight:500;cursor:pointer;transition:background .15s,border-color .15s,opacity .15s;}
  .chip .sw{width:10px;height:10px;border-radius:3px;}
  .chip em{font-style:normal;font-weight:400;color:var(--ink-3);font-size:11px;}
  .chip:hover{background:var(--wash);}
  .chip[aria-pressed="true"]{border-color:var(--ink);background:var(--wash);}
  body[data-focus] .chip[aria-pressed="false"]{opacity:.5;}
  .reset{margin-left:auto;font-size:11.5px;font-weight:500;color:var(--ink-2);background:none;border:none;cursor:pointer;text-decoration:underline;text-underline-offset:3px;visibility:hidden;}
  body[data-focus] .reset{visibility:visible;}

  /* BOARD */
  .board-wrap{padding:24px 44px 36px;}
  .scroller{overflow-x:auto;border:1px solid var(--line);border-radius:14px;}
  .board{display:grid;grid-template-columns:132px repeat(12,minmax(104px,1fr));min-width:1380px;}
  .corner,.mh{height:56px;border-bottom:1px solid var(--line);background:var(--wash);}
  .corner{border-right:1px solid var(--line);display:flex;align-items:center;padding-left:18px;font-size:11px;color:var(--ink-3);}
  .mh{display:flex;flex-direction:column;justify-content:center;padding:0 12px;border-right:1px solid var(--line);}
  .mh:last-child{border-right:none;}
  .mh b{font-size:14px;font-weight:600;}
  .mh small{font-size:10px;color:var(--ink-3);}
  .q-start{box-shadow:inset 2px 0 0 #d9d6cf;}

  .rl{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 14px 12px 16px;display:flex;flex-direction:column;justify-content:center;gap:3px;position:relative;cursor:default;}
  .rl::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 3px 3px 0;background:var(--c);}
  .rl b{font-size:12.5px;font-weight:500;line-height:1.25;}
  .rl small{font-size:10.5px;color:var(--ink-3);}
  .rl.last,.cell.last{border-bottom:none;}

  .cell{height:116px;padding:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:5px;}
  .cell.endcol{border-right:none;}
  .row-l1{background:#fffdf6;}

  .card{flex:1;min-height:0;width:100%;text-align:left;border:none;border-radius:8px;padding:8px 9px;display:flex;flex-direction:column;gap:3px;cursor:pointer;background:var(--t);box-shadow:inset 3px 0 0 var(--c);transition:transform .15s ease,box-shadow .15s ease,opacity .2s ease;}
  .card:hover{transform:translateY(-2px);box-shadow:inset 3px 0 0 var(--c),0 6px 16px rgba(51,51,51,.10);}
  .card .ct{font-size:11.5px;font-weight:500;line-height:1.25;color:var(--d);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .card .cs{font-size:9.5px;line-height:1.3;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .card .cd{margin-top:auto;font-size:9px;font-weight:400;color:var(--d);opacity:.85;}
  .card.has-date .cs{display:none;}
  .card.compact{padding:5px 9px;gap:2px;justify-content:center;}
  .card.compact .cd{margin-top:0;}
  .card.compact .cs{display:none;}
  .card.compact .ct{-webkit-line-clamp:1;}
  .card.compact .cd{margin-top:0;}

  .card.tbc{background:transparent;box-shadow:none;border:1.5px dashed #d8cfa8;cursor:default;align-items:flex-start;justify-content:center;}
  .card.tbc:hover{transform:none;box-shadow:none;}
  .card.tbc .ct{color:var(--ink-3);font-weight:500;}

  .empty{flex:1;}

  body[data-focus] .card{opacity:.16;}
  body[data-focus="l1"] .card.l1,body[data-focus="l2"] .card.l2,body[data-focus="l3"] .card.l3,
  body[data-focus="l4"] .card.l4,body[data-focus="l5"] .card.l5{opacity:1;}

  .notes{display:flex;gap:28px;padding:0 44px 28px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-2);}
  .notes span b{color:var(--ink);font-weight:600;}

  footer{display:flex;justify-content:space-between;align-items:center;padding:18px 44px 26px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink-3);}
  footer strong{color:var(--ink);font-weight:700;font-size:14px;}


  /* ===== SINGLE-SCREEN LAYOUT (laptops and up) ===== */
  #view-calendar{display:flex;flex-direction:column;}
  .masthead{flex:0 0 auto;}
  .year{padding:14px 26px 10px 32px;}
  .year span{font-size:clamp(52px,7.5vh,76px);letter-spacing:-3px;}
  .title-block{padding:14px 28px 12px;gap:4px;}
  .title-block h1{font-size:clamp(22px,3.4vh,28px);}
  .title-block p{font-size:12px;}
  .brand{padding:12px 32px 12px 0;justify-content:center;}
  .brand img{height:clamp(40px,6.4vh,58px);width:auto;display:block;}
  .toolbar{flex:0 0 auto;padding:10px 32px;gap:8px;}
  .chip{padding:5px 12px 5px 9px;font-size:11.5px;}
  .board-wrap{flex:1 1 auto;min-height:0;padding:12px 32px 10px;display:flex;}
  .scroller{flex:1;min-height:0;display:flex;}
  .board{flex:1;min-width:0;height:100%;grid-template-columns:112px repeat(12,minmax(0,1fr));grid-template-rows:44px repeat(5,minmax(0,1fr));}
  .corner,.mh{height:auto;}
  .mh{padding:0 10px;}
  .mh b{font-size:13px;}
  .rl{padding:8px 10px 8px 14px;}
  .rl b{font-size:11.5px;}
  .rl small{font-size:10px;}
  .cell{height:auto;min-height:0;overflow:hidden;padding:5px;gap:4px;}
  .card{min-height:0;overflow:hidden;padding:6px 8px;gap:2px;}
  .card .ct{font-size:clamp(10px,1.45vh,11.5px);-webkit-line-clamp:3;hyphens:auto;overflow-wrap:break-word;}
  .card .cs{font-size:9.5px;}
  .card .cd{font-size:9px;line-height:1.25;}
  .card.compact{padding:3px 8px;gap:1px;}
  .card.compact .cd,.card.compact .ct{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;}
  .card .em{margin-right:2px;}
  .card>span{flex-shrink:0;}
  .card.has-date .ct{-webkit-line-clamp:2;}
  .card.compact .em{display:none;}
  footer{flex:0 0 auto;padding:8px 32px 10px;font-size:11px;gap:20px;}
  footer b{color:var(--ink);font-weight:500;}
  @media (max-height:700px){ .title-block p{display:none;} }
  @media (max-height:620px){ .card .cs{-webkit-line-clamp:1;} }
  @media (max-height:620px){ .card:not(.has-date) .cs{display:none;} }

  /* Small screens: fall back to scrolling */
  @media (max-width:1023px), (max-height:540px){
    #view-calendar{display:block;}
    .board-wrap{display:block;}
    .scroller{display:block;overflow-x:auto;}
    .board{min-width:1180px;height:auto;grid-template-rows:44px repeat(5,104px);}
  }

  /* LOAD SEQUENCE */
  @media (prefers-reduced-motion:no-preference){
    .board .card{animation:rise .5s ease both;animation-delay:calc(var(--m) * 45ms + 120ms);}
    @keyframes rise{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  }
  @media (prefers-reduced-motion:reduce){.view,.card{transition:none;}}

  /* DETAIL */
  .d-band{background:var(--t);border-bottom:1px solid var(--line);}
  .d-nav{display:flex;align-items:center;gap:16px;padding:18px 44px;}
  .back{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-size:12px;font-weight:500;cursor:pointer;}
  .back:hover{border-color:var(--ink);}
  .back svg{width:14px;height:14px;}
  .d-crumb{font-size:11.5px;color:var(--ink-2);}
  .d-hero{padding:18px 44px 40px;display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:end;}
  .d-emoji{width:96px;height:96px;border-radius:20px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:48px;box-shadow:inset 0 -4px 0 var(--c);}
  .d-layer{display:inline-block;font-size:11px;font-weight:500;color:var(--d);background:#fff;border:1px solid var(--c);border-radius:999px;padding:4px 12px;margin-bottom:12px;}
  .d-title{font-size:44px;font-weight:600;line-height:1.05;letter-spacing:-1px;}
  .d-meta{margin-top:10px;font-size:13px;color:var(--ink-2);}
  .d-meta b{color:var(--d);font-weight:500;}
  .d-body{display:grid;grid-template-columns:1.1fr 1fr;gap:56px;padding:40px 44px 60px;max-width:1240px;}
  .d-body h2{font-size:13px;font-weight:600;color:var(--ink-3);margin-bottom:14px;}
  .d-body p{font-size:15px;line-height:1.8;max-width:62ch;}
  .tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px;}
  .tags span{font-size:11.5px;font-weight:500;padding:5px 12px;border-radius:999px;background:var(--wash);border:1px solid var(--line);color:var(--ink-2);}
  .fmt{display:flex;flex-direction:column;gap:10px;}
  .fmt div{display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:start;padding:14px 16px;border-radius:12px;border:1px solid var(--line);}
  .fmt i{font-style:normal;font-size:20px;line-height:1.3;}
  .fmt strong{display:block;font-size:13.5px;font-weight:500;margin-bottom:2px;}
  .fmt span{font-size:12.5px;color:var(--ink-2);line-height:1.5;}

  /* TOOLTIP */
  #tip{position:fixed;width:210px;background:#fff;border-radius:10px;padding:12px 14px;box-shadow:0 12px 32px rgba(0,0,0,.16),0 2px 6px rgba(0,0,0,.08);pointer-events:none;display:none;z-index:9999;border-top:3px solid var(--c,#333);}
  #tip b{display:block;font-size:12px;font-weight:600;margin-bottom:4px;}
  #tip p{font-size:11px;color:var(--ink-2);line-height:1.5;}
  #tip small{display:block;margin-top:6px;font-size:10px;font-weight:400;color:var(--ink-3);}

  @media (max-width:900px){
    .masthead{grid-template-columns:auto 1fr;}
    .brand{display:none;}
    .year span{font-size:72px;letter-spacing:-3px;}
    .year{padding:22px 22px 16px 22px;}
    .title-block{padding:22px;}
    .title-block h1{font-size:24px;}
    .toolbar,.board-wrap,.notes,footer,.d-nav{padding-left:20px;padding-right:20px;}
    .d-hero{padding:12px 20px 28px;grid-template-columns:1fr;}
    .d-title{font-size:32px;}
    .d-body{grid-template-columns:1fr;gap:36px;padding:28px 20px 48px;}
  }
</style>
</head>

const aMap={};A.forEach(a=>aMap[a.id]=a);
const L={};LAYERS.forEach(l=>L[l.k]=l);
const vars=k=>`--c:var(--${k});--t:var(--${k}-t);--d:var(--${k}-d);`;

// Toolbar
const tb=document.getElementById('toolbar');
LAYERS.forEach(l=>{
  const b=document.createElement('button');
  b.className='chip';b.dataset.k=l.k;b.setAttribute('aria-pressed','false');
  b.innerHTML=`<span class="sw" style="background:var(--${l.k})"></span>${l.name} <em>${l.freq}</em>`;
  b.addEventListener('click',()=>{
    const on=document.body.dataset.focus===l.k;
    if(on){delete document.body.dataset.focus;}else{document.body.dataset.focus=l.k;}
    tb.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',String(!on&&c.dataset.k===l.k)));
  });
  tb.appendChild(b);
});
const rs=document.createElement('button');rs.className='reset';rs.textContent='Show all layers';
rs.addEventListener('click',()=>{delete document.body.dataset.focus;tb.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed','false'));});
tb.appendChild(rs);

// Board
const board=document.getElementById('board');
let html='<div class="corner">Layer / Month</div>';
MONTHS.forEach((m,i)=>{html+=`<div class="mh${i%3===0&&i?' q-start':''}"><b>${m.slice(0,3)}</b><small>Q${Math.floor(i/3)+1} 2027</small></div>`;});
LAYERS.forEach((l,r)=>{
  const last=r===LAYERS.length-1?' last':'';
  html+=`<div class="rl${last}" style="--c:var(--${l.k})" data-k="${l.k}"><b>${l.name}</b><small>${l.freq}</small></div>`;
  MONTHS.forEach((m,i)=>{
    const items=A.filter(a=>a.m===i&&a.k===l.k);
    const cls=`cell row-${l.k}${last}${i===11?' endcol':''}${i%3===0&&i?' q-start':''}`;
    let inner='';
    if(!items.length){inner='<div class="empty"></div>';}
    items.forEach(a=>{
      if(a.tbc){inner+=`<div class="card tbc ${l.k}" style="${vars(l.k)}--m:${i}" data-tbc="1"><span class="ct">${a.title}</span><span class="cs">Open slot</span></div>`;return;}
      const compact=(items.length>1?' compact':'')+(a.date?' has-date':'');
      inner+=`<button class="card ${l.k}${compact}" style="${vars(l.k)}--m:${i}" data-id="${a.id}" aria-label="${a.title}, ${m} 2027">
        <span class="ct"><span class="em">${a.emoji}</span>${a.title}</span><span class="cs">${a.sub}</span>${a.date?`<span class="cd">${items.length>1&&a.sdate?a.sdate:a.date}</span>`:''}</button>`;
    });
    html+=`<div class="${cls}">${inner}</div>`;
  });
});
board.innerHTML=html;

// Tooltip
const tip=document.getElementById('tip'),tB=document.getElementById('tB'),tP=document.getElementById('tP'),tS=document.getElementById('tS');
function showTip(e,c,title,desc,foot){tip.style.setProperty('--c',c);tB.textContent=title;tP.textContent=desc;tS.textContent=foot||'';tS.style.display=foot?'block':'none';tip.style.display='block';moveTip(e);}
function moveTip(e){const W=tip.offsetWidth,H=tip.offsetHeight;let x=e.clientX+16,y=e.clientY-H-12;if(y<8)y=e.clientY+18;if(x+W>innerWidth-8)x=e.clientX-W-16;tip.style.left=x+'px';tip.style.top=y+'px';}
function hideTip(){tip.style.display='none';}
document.addEventListener('mousemove',e=>{if(tip.style.display==='block')moveTip(e);});
board.querySelectorAll('.card[data-id]').forEach(c=>{const a=aMap[c.dataset.id];c.addEventListener('mouseenter',e=>showTip(e,`var(--${a.k})`,a.title,a.tip,'Click to open'));c.addEventListener('mouseleave',hideTip);});
board.querySelectorAll('.card[data-tbc]').forEach(c=>{c.addEventListener('mouseenter',e=>showTip(e,'var(--l1)','Open slot','This month\'s campaign theme hasn\'t been decided yet.'));c.addEventListener('mouseleave',hideTip);});
board.querySelectorAll('.rl').forEach(r=>{const l=L[r.dataset.k];r.addEventListener('mouseenter',e=>showTip(e,`var(--${l.k})`,l.name,l.desc));r.addEventListener('mouseleave',hideTip);});

// Detail
function openDetail(id){
  const a=aMap[id];if(!a)return;hideTip();
  const l=L[a.k],month=MONTHS[a.m];
  document.getElementById('view-detail').setAttribute('style',vars(a.k));
  document.getElementById('dCrumb').textContent=`${month} 2027, ${a.title}`;
  document.getElementById('dEmoji').textContent=a.emoji;
  document.getElementById('dLayer').textContent=l.name;
  document.getElementById('dTitle').textContent=a.title;
  document.getElementById('dMeta').innerHTML=`${month} 2027, ${a.sub}${a.date?` &nbsp;<b>${a.date}</b>`:''}`;
  document.getElementById('dWhat').textContent=a.what;
  document.getElementById('dTags').innerHTML=a.tags.map(t=>`<span>${t}</span>`).join('');
  document.getElementById('dFmt').innerHTML=a.fmt.map(f=>`<div><i>${f.i}</i><p style="font-size:inherit;line-height:inherit"><strong>${f.l}</strong><span>${f.d}</span></p></div>`).join('');
  document.getElementById('view-detail').scrollTop=0;
  document.body.classList.add('detail-open');
  document.getElementById('backBtn').focus();
}
function closeDetail(){document.body.classList.remove('detail-open');}
board.addEventListener('click',e=>{const c=e.target.closest('.card[data-id]');if(c)openDetail(c.dataset.id);});
document.getElementById('backBtn').addEventListener('click',closeDetail);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('detail-open'))closeDetail();});
</script>
</body>
</html>
